services:
  # ── Web (Flask + Gunicorn) ─────────────────────────────────────────────────
  - type: web
    name: samsoftpay
    env: python
    region: oregon
    # Starter, matching real production — 'free' here meant a Blueprint sync
    # would downgrade the live service (free spins down under MTN callbacks
    # and does not run preDeployCommand, silently stopping migrations).
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    preDeployCommand: python -m flask --app run.py db upgrade
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      # Gates the one-time /first-setup admin bootstrap. Read its value from the
      # Render dashboard when you need it: /first-setup?token=<SETUP_TOKEN>
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: samsoftpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: samsoftpay-redis
          type: redis
          property: connectionString
      - key: BASE_URL
        # The custom domain, matching production — the onrender.com fallback
        # here meant a Blueprint sync broke every callback/redirect URL.
        value: https://api.samsoftpay.com
      # Set these manually in Render dashboard after first deploy:
      # MOMO_USE_REAL, MOMO_SUBSCRIPTION_KEY, MOMO_API_USER, MOMO_API_KEY
      # MOMO_DISBURSEMENT_SUBSCRIPTION_KEY, MOMO_DISBURSEMENT_API_USER, MOMO_DISBURSEMENT_API_KEY
      # FLUTTERWAVE_SECRET_KEY
      # CHANGENOW_API_KEY, CHANGENOW_RECEIVING_ADDRESS
      # MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
      # Alerting (optional): SLACK_WEBHOOK_URL (Slack Incoming Webhook), ALERT_EMAIL
      #   (defaults to ADMIN_EMAIL), ADMIN_EMAIL. HEARTBEAT_STALE_SECONDS (default 300).
      #   Point an external uptime monitor at /ops/status (503 = worker/beat dead).

  # ── Celery Worker (processes tasks from Redis queue) ──────────────────────
  - type: worker
    name: samsoftpay-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_worker:celery worker --loglevel=info --concurrency=2
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: samsoftpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: samsoftpay-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: samsoftpay
          type: web
          envVarKey: SECRET_KEY
      - key: WEBHOOK_SIGNING_SECRET
        fromService:
          name: samsoftpay
          type: web
          envVarKey: WEBHOOK_SIGNING_SECRET
      # Same MOMO_* vars as web service — set manually in dashboard.
      # Alerts fire from beat tasks that run HERE, so the worker also needs the
      # alerting + mail vars to actually deliver: SLACK_WEBHOOK_URL, ALERT_EMAIL
      # (or ADMIN_EMAIL), MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD/MAIL_FROM.

  # ── Celery Beat (periodic task scheduler) ─────────────────────────────────
  - type: worker
    name: samsoftpay-beat
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_worker:celery beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: samsoftpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: samsoftpay-redis
          type: redis
          property: connectionString
      # Share the web service's secrets so the production boot-guard passes here too.
      - key: SECRET_KEY
        fromService:
          name: samsoftpay
          type: web
          envVarKey: SECRET_KEY
      - key: WEBHOOK_SIGNING_SECRET
        fromService:
          name: samsoftpay
          type: web
          envVarKey: WEBHOOK_SIGNING_SECRET

databases:
  - name: samsoftpay-db
    databaseName: samsoftpay
    user: samsoftpay
    plan: free

  # ── Redis (Celery broker + result backend) ─────────────────────────────────
  - name: samsoftpay-redis
    type: redis
    plan: free
    region: oregon
    # Celery REQUIRES noeviction: allkeys-lru silently evicted queued poll and
    # webhook tasks under memory pressure — jobs vanished with no error.
    maxmemoryPolicy: noeviction
