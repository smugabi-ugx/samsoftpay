<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment link unavailable</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/InterVariable.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 2rem 1rem; }
    .card { max-width: 460px; background: #fff; border: 1px solid #e2e8f0; padding: 2.5rem 2.25rem; border-radius: 16px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
    h1 { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1.5rem; color: #0f172a; margin: 0 0 .75rem; }
    p { color: #64748b; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>This link is no longer active</h1>
    <p>The payment link from {{ merchant.name }} has been deactivated. Please contact them for a new link.</p>
  </div>
</body>
</html>
