<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-Factor Authentication | Samsoftpay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card {
      width: 100%; max-width: 440px; background: white;
      border-radius: 16px; border: 1px solid #e2e8f0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      padding: 2.5rem; margin: 1.5rem;
    }
    .icon-wrap {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(16,185,129,0.1);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-wrap svg { width: 32px; height: 32px; color: #10b981; }
    h2 { font-size: 1.5rem; font-weight: 700; color: #0f172a; text-align: center; margin-bottom: 0.5rem; }
    p { color: #64748b; text-align: center; font-size: 0.9375rem; line-height: 1.6; margin-bottom: 1.75rem; }
    .otp-single {
      width: 100%; height: 64px; text-align: center;
      font-size: 2rem; font-weight: 700; font-family: monospace;
      letter-spacing: 0.5rem; text-indent: 0.5rem;
      border: 2px solid #e2e8f0; border-radius: 10px; transition: all 0.2s; margin-bottom: 0.5rem;
    }
    .otp-single:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
    .otp-single.invalid { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(239,68,68,0.12); }
    .hint { text-align: center; font-size: 0.8125rem; color: #94a3b8; margin-bottom: 1.25rem; min-height: 1.1em; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-submit {
      width: 100%; padding: 0.875rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.3s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(16,185,129,0.3); }
    .error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: #dc2626; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1.25rem; text-align: center; }
    .info { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.25); color: #1d4ed8; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1.25rem; text-align: center; }
    .resend { text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: #64748b; }
    .resend button { background: none; border: none; color: #6366f1; font-weight: 600; cursor: pointer; font-family: inherit; font-size: inherit; }
    .back-link { display: block; text-align: center; margin-top: 1rem; color: #6366f1; font-size: 0.875rem; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>Two-factor authentication</h2>
    <p>Enter the 6-digit code we emailed you to complete sign-in.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if info %}<div class="info">{{ info }}</div>{% endif %}

    <form method="POST" action="{{ url_for('auth.verify_2fa') }}" id="otp-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="code" id="otp-code" class="otp-single"
             inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}"
             maxlength="6" placeholder="000000" aria-label="6-digit sign-in code"
             autofocus required>
      <div class="hint" id="otp-hint">Enter the 6-digit code</div>
      <button type="submit" class="btn-submit">Verify &amp; Sign In</button>
    </form>

    <div class="resend">
      Didn't receive it?
      <form method="POST" action="{{ url_for('auth.resend_2fa') }}" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Resend code</button>
      </form>
    </div>
    <a href="{{ url_for('auth.login_page') }}" class="back-link">← Back to login</a>
  </div>

  <script>
    (function () {
      var inp = document.getElementById('otp-code');
      var hint = document.getElementById('otp-hint');
      var base = 'Enter the 6-digit code';
      function clean() {
        var v = inp.value.replace(/\D/g, '').slice(0, 6);
        if (v !== inp.value) inp.value = v;
        inp.classList.remove('invalid');
        hint.textContent = v.length === 6 ? 'Ready — click Verify' : base + ' (' + v.length + '/6)';
        return v.length === 6;
      }
      inp.addEventListener('input', clean);
      document.getElementById('otp-form').addEventListener('submit', function (e) {
        if (!clean()) {
          e.preventDefault();
          inp.classList.add('invalid'); inp.focus();
          hint.textContent = 'Please enter all 6 digits before continuing';
        }
      });
      inp.focus();
    })();
  </script>
</body>
</html>
